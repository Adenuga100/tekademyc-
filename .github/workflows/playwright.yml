name: Playwright C# Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        
      - name: Install dependencies
        run: dotnet restore
        
      - name: Install Playwright browsers
        run: dotnet exec playwright.ps1 install
        
      - name: Run tests
        run: dotnet test
        env:
          # Enable headless mode for Chromium
          PLAYWRIGHT_HEADLESS: 1
