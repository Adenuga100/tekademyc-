name: Playwright C# Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0' # Adjust to your .NET version
      
      - name: Install Playwright browsers
        run: dotnet tool install --global Microsoft.Playwright.CLI && playwright install chromium
      
      - name: Install dependencies
        run: dotnet restore
      
      # ADD THIS SECTION - Install virtual display server
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      
      # ADD THIS SECTION - Run tests with virtual display
      - name: Run Playwright tests
        run: xvfb-run -a dotnet test --logger "console;verbosity=detailed"
        env:
          DISPLAY: :99
